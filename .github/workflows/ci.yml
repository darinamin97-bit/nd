name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install
        run: pnpm i

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
